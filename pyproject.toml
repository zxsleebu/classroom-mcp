[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-mcp"
version = "0.2.0+obot.1"
description = "Read-only Google Classroom + Gmail MCP server for a student account, headless (env-var credentials). No dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["mcp", "model-context-protocol", "google-classroom", "gmail", "students", "education"]

[project.urls]
Homepage = "https://github.com/zxsleebu/classroom-mcp"

[project.scripts]
classroom-mcp = "classroom_mcp:cli"

[tool.setuptools]
py-modules = ["classroom_mcp"]
